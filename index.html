<h1 class="color">Hello World!</h1>

<style>
.color {
  animation: colors 2s infinite alternate;
}
@keyframes colors {
  from { color: red; }
  to { color: blue; }
}
</style>

<h2 class="bounce">Welcome!</h2>

<style>
.bounce {
  display: inline-block;
  animation: bounce 1s infinite alternate;
}
@keyframes bounce {
  to { transform: translateY(-10px); }
}
</style>
